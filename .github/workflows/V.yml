name: Cancel queued runs
on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes
  workflow_dispatch:  # allows manual trigger too

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel queued runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer 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" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Buloloouuu/Fu/actions/runs?status=queued&per_page=100" \
            | jq -r '.workflow_runs[].id' \
            | xargs -I{} curl -s -X POST \
                -H "Authorization: Bearer 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" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/Buloloouuu/Fu/actions/runs/{}/cancel"
