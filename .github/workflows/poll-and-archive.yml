name: Poll Catalog and Archive Threads

# Multiple boards, each on its own cron — mirrors what used to be
# Cloudflare Cron Triggers + boardForCron() in cf-worker/index.js. Keep
# this list in sync with ADDITIONAL_BOARDS there (host/path/cadence) and
# with getBoards() in deno-service/sync-ia.ts.
#
# The FIRST cron entry below is the "default" board — it's the one that
# falls through to the vars.BOARD_HOST/BOARD_PATH repo variables in the
# "Resolve board" step, the same way cf-worker/index.js's boardForCron()
# treated the board with `cron: null` as the fallback.
on:
  schedule:
    - cron: "*/5 * * * *" # default board (BOARD_HOST/BOARD_PATH vars)
    - cron: "*/6 * * * *" # may.2chan.net/b/
    - cron: "*/16 * * * *" # jun.2chan.net/jun/
    - cron: "*/18 * * * *" # dec.2chan.net/dec/
  workflow_dispatch:
    inputs:
      boardHost:
        description: "Board host to poll (manual run — leave blank to use the default board)"
        required: false
      boardPath:
        description: "Board path to poll (manual run — leave blank to use the default board)"
        required: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      threads: ${{ steps.poll.outputs.threads }}
      count: ${{ steps.poll.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Uses `=` (literal string equality), not a case/glob pattern, so a
      # cron string that happens to share digits with another (e.g. "/6"
      # vs "/16") can't accidentally match the wrong branch.
      - name: Resolve board for this trigger
        id: board
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_HOST: ${{ inputs.boardHost }}
          INPUT_PATH: ${{ inputs.boardPath }}
        run: |
          if [ "$SCHEDULE" = "*/6 * * * *" ]; then
            HOST="may.2chan.net"; PATH_="/b/"
          elif [ "$SCHEDULE" = "*/16 * * * *" ]; then
            HOST="jun.2chan.net"; PATH_="/jun/"
          elif [ "$SCHEDULE" = "*/18 * * * *" ]; then
            HOST="dec.2chan.net"; PATH_="/dec/"
          elif [ -n "$INPUT_HOST" ]; then
            HOST="$INPUT_HOST"; PATH_="$INPUT_PATH"
          else
            HOST="${{ vars.BOARD_HOST }}"; PATH_="${{ vars.BOARD_PATH }}"
          fi
          if [ -z "$HOST" ] || [ -z "$PATH_" ]; then
            echo "::error::Could not resolve a board host/path for this trigger" >&2
            exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "path=$PATH_" >> "$GITHUB_OUTPUT"

      - name: Poll catalog and mark pending
        id: poll
        env:
          BOARD_HOST: ${{ steps.board.outputs.host }}
          BOARD_PATH: ${{ steps.board.outputs.path }}
          USER_AGENT: ${{ vars.USER_AGENT }}
          MIN_REPLIES: ${{ vars.MIN_REPLIES }}
          MAX_THREADS_PER_RUN: ${{ vars.MAX_THREADS_PER_RUN }}
          MAX_ASSETS_PER_THREAD: ${{ vars.MAX_ASSETS_PER_THREAD }}
          MAX_ASSET_BYTES: ${{ vars.MAX_ASSET_BYTES }}
          OFFLOAD_BASE_URL: ${{ vars.OFFLOAD_BASE_URL }}
          OFFLOAD_BASE_URL_F3: ${{ vars.OFFLOAD_BASE_URL_F3 }}
          CXYL_COOKIE: ${{ vars.CXYL_COOKIE }}
          WORKER_CALLBACK_URL: ${{ vars.WORKER_CALLBACK_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        # --allow-write is scoped to just $GITHUB_OUTPUT (rather than a
        # blanket --allow-write) since that's the only file this script
        # ever writes to (via writeOutput()'s Deno.writeTextFile call) —
        # everything else it does is network (catalog fetch, R2 get/put).
        run: deno run --allow-net --allow-env --allow-write="$GITHUB_OUTPUT" deno-service/poll-and-dispatch.ts

  archive:
    needs: poll
    # Skips cleanly when there's nothing to archive, instead of erroring
    # on an empty matrix.
    if: needs.poll.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Bounds how many threads' archive jobs run at once — same role
      # ARCHIVE_CONCURRENCY used to play on the Worker side. With
      # MAX_THREADS_PER_RUN raised to 52, a max-parallel of 5 means a full
      # batch takes roughly 11 waves to drain — raise this further if that
      # ends up taking too long relative to the 5-minute poll interval.
      # The repo's public-repo unlimited Actions minutes and the ~60
      # concurrent-job ceiling for public repos give plenty of headroom to
      # go higher here if needed.
      max-parallel: 5
      fail-fast: false
      matrix:
        thread: ${{ fromJson(needs.poll.outputs.threads) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Archive thread
        env:
          PAYLOAD_JSON: ${{ toJson(matrix.thread) }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CALLBACK_SECRET: ${{ secrets.W_SHARED_SECRET }}
        run: deno run --allow-net --allow-env deno-service/archive-thread.ts
