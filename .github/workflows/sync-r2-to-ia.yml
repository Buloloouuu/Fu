name: Sync TeraBox Archive to Internet Archive
# Drains archived thread ZIPs sitting in TeraBox (see
# deno-service/terabox-store.ts / archive-thread.ts's storage step) into
# Internet Archive.
#
# STORAGE BACKEND: this used to target GitHub Releases (before that B2,
# before that Cloudflare R2). All three are gone — this now reads/deletes
# directly against TeraBox via the terabox-api npm package, same as the
# rest of this project. Auth is a single long-lived TeraBox session
# cookie (TERABOX_NDUS) instead of a GitHub token or an AWS-signature-v4
# request.
#
# PERMISSIONS: no `contents: write` needed anymore — nothing here touches
# this repo, so the default read-only GITHUB_TOKEN is fine (and unused).
#
# OVERLAP NOTE: this is now the ONLY thing draining archived threads into
# IA — deno-service/catalog.ts's own IA sync was removed when this project
# moved off Cloudflare, so there's no second sweep to worry about
# double-processing with anymore.
#
# Runs on a schedule and can also be triggered manually from the Actions
# tab (with an optional one-off SAMPLE_LIMIT override for that run).
on:
  schedule:
    # Every 20 minutes. Adjust to taste based on how much volume actually
    # accumulates in TeraBox between sweeps.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      sample_limit:
        description: >
          Override SAMPLE_LIMIT for this run only (total threads to sync
          across all boards, round-robin). Leave blank to use the
          repo/environment variable default (45 if that's also unset).
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Board listing + up to SAMPLE_LIMIT sequential IA uploads/deletes —
    # generous but bounded, same reasoning as archive-thread.yml's job
    # timeout.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Sync TeraBox archive to Internet Archive
        env:
          # TeraBox session token — replaces GITHUB_TOKEN/GITHUB_OWNER/
          # GITHUB_REPO and B2_KEY_ID/B2_APPLICATION_KEY/B2_BUCKET_NAME/
          # B2_REGION/R2_* entirely; no separate storage-provider account
          # to manage beyond this one cookie value.
          TERABOX_NDUS: ${{ secrets.TERABOX_NDUS }}
          TERABOX_ROOT_DIR: ${{ vars.TERABOX_ROOT_DIR }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_IDENTIFIER: ${{ secrets.IA_IDENTIFIER }}
          IA_COLLECTION: ${{ secrets.IA_COLLECTION }}
          IA_MEDIATYPE: ${{ secrets.IA_MEDIATYPE }}
          IA_ITEM_TITLE: ${{ secrets.IA_ITEM_TITLE }}
          IA_ITEM_DESCRIPTION: ${{ secrets.IA_ITEM_DESCRIPTION }}
          # Env var name kept as-is (not renamed to e.g.
          # DELETE_FROM_TERABOX_AFTER_SYNC) for continuity with earlier
          # revisions of this project.
          DELETE_FROM_R2_AFTER_SYNC: ${{ vars.DELETE_FROM_R2_AFTER_SYNC }}
          # workflow_dispatch input wins when provided; otherwise fall
          # back to the repo/environment variable, then the script's own
          # default of 45.
          SAMPLE_LIMIT: ${{ github.event.inputs.sample_limit || vars.SAMPLE_LIMIT }}
        run: |
          # -A (allow-all): fresh, disposable Actions runner per job, no
          # need to hand-pick permissions. No aws4fetch/S3-signing
          # dependency — plain terabox-api HTTP calls + IA's IAS3 fetch.
          deno run -A deno-service/sync-terabox-to-ia.ts
