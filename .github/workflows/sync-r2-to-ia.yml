name: Sync R2 Fallback to Internet Archive
# Drains whatever archive-thread.ts couldn't push straight to Internet
# Archive (see deno-service/archive-thread.ts's IA-first-with-R2-fallback
# storage logic). Under normal operation this bucket should stay near-
# empty; this workflow exists to catch and retry the cases where an IA
# PUT failed at archive time (outage, rate limit, bad creds, oversized
# item, etc) and the zip landed in R2 instead.
#
# Runs on a schedule and can also be triggered manually from the Actions
# tab (with an optional one-off SAMPLE_LIMIT override for that run).
on:
  schedule:
    # Every 6 hours. Adjust to taste — this only matters for however much
    # volume actually falls through to the R2 fallback path, which should
    # be small/rare if IA uploads are healthy.
    - cron: "*/8 * * * *"
  workflow_dispatch:
    inputs:
      sample_limit:
        description: >
          Override SAMPLE_LIMIT for this run only (total threads to sync
          across all folders, round-robin). Leave blank to use the
          repo/environment secret default (45 if that's also unset).
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Bucket listing + up to SAMPLE_LIMIT sequential IA uploads/deletes —
    # generous but bounded, same reasoning as archive-thread.yml's job
    # timeout.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Sync R2 fallback objects to Internet Archive
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_IDENTIFIER: ${{ secrets.IA_IDENTIFIER }}
          IA_COLLECTION: ${{ secrets.IA_COLLECTION }}
          IA_MEDIATYPE: ${{ secrets.IA_MEDIATYPE }}
          IA_ITEM_TITLE: ${{ secrets.IA_ITEM_TITLE }}
          IA_ITEM_DESCRIPTION: ${{ secrets.IA_ITEM_DESCRIPTION }}
          DELETE_FROM_R2_AFTER_SYNC: ${{ vars.DELETE_FROM_R2_AFTER_SYNC }}
          # workflow_dispatch input wins when provided; otherwise fall
          # back to the repo/environment variable, then the script's own
          # default of 45.
          SAMPLE_LIMIT: ${{ github.event.inputs.sample_limit || vars.SAMPLE_LIMIT }}
        run: |
          # -A (allow-all): same reasoning as archive-thread.yml — this is
          # a fresh, disposable Actions runner per job, and the
          # "npm:aws4fetch" import needs read/write access to Deno's local
          # module cache (plus a couple of --allow-sys runtime checks),
          # not just --allow-net/--allow-env.
          deno run -A deno-service/sync-r2-to-ia.ts
