name: Archive Futaba Thread

# Triggered per-thread by the Cloudflare Worker via GitHub's
# repository_dispatch API (see cf-worker/index.js,
# dispatchArchiveThreadViaGitHubActions). workflow_dispatch is also wired
# up so you can trigger a single-thread archive manually from the Actions
# tab for testing, by pasting the same JSON shape into the `payload` input.
on:
  repository_dispatch:
    types: [archive-thread]
  workflow_dispatch:
    inputs:
      payload:
        description: >
          JSON payload, same shape as the Worker's client_payload:
          {"threadId":"...","boardHost":"...","boardPath":"...","replies":0,
          "userAgent":"...","maxAssetsPerThread":40,"maxAssetBytes":0,
          "offloadUploaders":[{"prefix":"fu","baseUrl":"..."}],
          "callbackUrl":"https://your-worker.workers.dev/thread-complete"}
        required: true

jobs:
  archive:
    runs-on: ubuntu-latest
    # Generous but bounded — a single thread with dozens of large video
    # assets should still finish in well under this on a standard runner.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Normalizes both trigger types into a single PAYLOAD_JSON env var so
      # archive-thread.ts only ever has to parse one JSON blob, regardless
      # of whether this run came from the Worker or a manual test.
      - name: Resolve payload
        id: resolved
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s' '${{ inputs.payload }}' > payload.json
          else
            cat <<'EOF' > payload.json
          ${{ toJson(github.event.client_payload) }}
          EOF
          fi
          # Fail fast with a clear error if the payload isn't valid JSON,
          # rather than letting archive-thread.ts's generic parse error
          # obscure what went wrong at the workflow level.
          jq empty payload.json

      - name: Archive thread
        env:
          PAYLOAD_JSON_FILE: payload.json
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CALLBACK_SECRET: ${{ secrets.W_SHARED_SECRET }}
        run: |
          export PAYLOAD_JSON="$(cat "$PAYLOAD_JSON_FILE")"
          deno run --allow-net --allow-env deno-service/archive-thread.ts
