name: Sync Archives to Internet Archive

# Primary sync path now — replaces the Worker's old hourly SYNC_CRON,
# which was the one throwing `exceededCpu` most often (real per-byte work
# reading full zip/html buffers, not just orchestration). The Worker keeps
# its own copy of this logic at GET /sync-ia?token=... as a manual/backup
# trigger — see the header comment in deno-service/sync-ia.ts for the
# (low-risk) implications of running both.
on:
  schedule:
    - cron: "0 * * * *" # hourly — keep in sync with SYNC_CRON if still referenced anywhere
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    # Generous: a big backlog of large video-heavy zips can take a while
    # to walk through, and there's no CPU cap here to worry about, just
    # wall-clock.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Sync to Internet Archive
        env:
          BOARD_HOST: ${{ vars.BOARD_HOST }}
          BOARD_PATH: ${{ vars.BOARD_PATH }}
          MAX_SYNC_PER_RUN: ${{ vars.MAX_SYNC_PER_RUN }}
          DELETE_FROM_R2_AFTER_SYNC: ${{ vars.DELETE_FROM_R2_AFTER_SYNC }}
          IA_IDENTIFIER: ${{ vars.IA_IDENTIFIER }}
          IA_ITEM_TITLE: ${{ vars.IA_ITEM_TITLE }}
          IA_ITEM_DESCRIPTION: ${{ vars.IA_ITEM_DESCRIPTION }}
          IA_COLLECTION: ${{ vars.IA_COLLECTION }}
          IA_MEDIATYPE: ${{ vars.IA_MEDIATYPE }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: deno run --allow-net --allow-env deno-service/sync-ia.ts
